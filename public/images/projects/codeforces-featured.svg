<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" rx="30" fill="#0B0F19" />
  <rect x="2" y="2" width="1396" height="896" rx="28" stroke="#1F2937" stroke-width="4" stroke-opacity="0.4" />

  <!-- Navigation sidebar -->
  <g id="sidebar" transform="translate(0, 0)">
    <rect x="0" y="0" width="80" height="900" fill="#070A13" rx="30" />
    <line x1="80" y1="0" x2="80" y2="900" stroke="#1E293B" stroke-width="2" />
    
    <!-- Icons -->
    <g transform="translate(25, 60)">
      <circle cx="15" cy="15" r="12" fill="#3B82F6" />
      <circle cx="15" cy="95" r="12" fill="#4B5563" />
      <circle cx="15" cy="175" r="12" fill="#4B5563" />
      <circle cx="15" cy="255" r="12" fill="#4B5563" />
    </g>
  </g>

  <!-- Left Center Panel: Recommended problems -->
  <g id="main-area" transform="translate(120, 60)">
    <text x="0" y="45" fill="#F3F4F6" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Recommended for you</text>
    
    <!-- Problem Card 1 -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="280" height="340" rx="20" fill="#070A13" stroke="#1E293B" stroke-width="2" />
      <text x="30" y="70" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">1400</text>
      <text x="30" y="115" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">DP</text>
      <text x="30" y="145" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Medium</text>
      <!-- Solve button -->
      <rect x="30" y="240" width="220" height="50" rx="10" fill="#1E293B" />
      <text x="140" y="271" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Solve</text>
    </g>

    <!-- Problem Card 2 -->
    <g transform="translate(310, 90)">
      <rect x="0" y="0" width="280" height="340" rx="20" fill="#070A13" stroke="#1E293B" stroke-width="2" />
      <text x="30" y="70" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">1500</text>
      <text x="30" y="115" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Graphs</text>
      <text x="30" y="145" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Hard</text>
      <!-- Solve button -->
      <rect x="30" y="240" width="220" height="50" rx="10" fill="#1E293B" />
      <text x="140" y="271" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Solve</text>
    </g>

    <!-- Problem Card 3 -->
    <g transform="translate(620, 90)">
      <rect x="0" y="0" width="280" height="340" rx="20" fill="#070A13" stroke="#1E293B" stroke-width="2" />
      <text x="30" y="70" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">1300</text>
      <text x="30" y="115" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Greedy</text>
      <text x="30" y="145" fill="#EC4899" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Medium</text>
      <!-- Solve button -->
      <rect x="30" y="240" width="220" height="50" rx="10" fill="#1E293B" />
      <text x="140" y="271" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Solve</text>
    </g>

    <!-- Bottom progress track -->
    <g transform="translate(0, 500)">
      <rect x="0" y="0" width="900" height="230" rx="20" fill="#070A13" stroke="#1E293B" stroke-width="2" />
      <text x="40" y="55" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Your Progress</text>
      
      <!-- Progress Bar -->
      <rect x="40" y="100" width="820" height="24" rx="12" fill="#1E293B" />
      <rect x="40" y="100" width="600" height="24" rx="12" fill="#3B82F6" />
      
      <text x="40" y="170" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">1480 / 2000</text>
      <text x="860" y="170" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end">74% Done</text>
    </g>
  </g>

  <!-- Right Panel: User Stats -->
  <g id="stats-panel" transform="translate(1070, 60)">
    <rect x="0" y="0" width="290" height="730" rx="20" fill="#070A13" stroke="#1E293B" stroke-width="2" />
    <text x="30" y="55" fill="#F3F4F6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Your Stats</text>
    
    <!-- Stat 1: Rating -->
    <g transform="translate(30, 110)">
      <text x="0" y="0" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Rating</text>
      <text x="0" y="45" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">1484</text>
    </g>

    <!-- Stat 2: Problems Solved -->
    <g transform="translate(30, 260)">
      <text x="0" y="0" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Problems Solved</text>
      <text x="0" y="45" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">1520</text>
    </g>

    <!-- Stat 3: Contests -->
    <g transform="translate(30, 410)">
      <text x="0" y="0" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Contests</text>
      <text x="0" y="45" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="900">38</text>
    </g>
  </g>
</svg>
