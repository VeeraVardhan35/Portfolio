<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" rx="30" fill="#0B0F19" />
  <rect x="2" y="2" width="1396" height="896" rx="28" stroke="#1F2937" stroke-width="4" stroke-opacity="0.4" />

  <!-- Left Sidebar -->
  <g id="sidebar" transform="translate(0, 0)">
    <rect x="0" y="0" width="240" height="900" fill="#070A13" rx="30" />
    <line x1="240" y1="0" x2="240" y2="900" stroke="#1E293B" stroke-width="2" />
    
    <!-- Logo -->
    <text x="40" y="70" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">toopz</text>
    
    <!-- Navigation list -->
    <g transform="translate(30, 150)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
      <!-- Active Item: Home -->
      <g transform="translate(0, 0)">
        <rect x="-15" y="-12" width="195" height="42" rx="8" fill="#1E293B" />
        <rect x="5" y="0" width="16" height="16" rx="3" fill="#3B82F6" />
        <text x="35" y="14" fill="#FFF">Home</text>
      </g>
      
      <!-- Item: Groups -->
      <g transform="translate(0, 56)">
        <rect x="5" y="0" width="16" height="16" rx="3" fill="#4B5563" />
        <text x="35" y="14" fill="#94A3B8">Groups</text>
      </g>

      <!-- Item: Events -->
      <g transform="translate(0, 112)">
        <rect x="5" y="0" width="16" height="16" rx="3" fill="#4B5563" />
        <text x="35" y="14" fill="#94A3B8">Events</text>
      </g>

      <!-- Item: Messages -->
      <g transform="translate(0, 168)">
        <rect x="5" y="0" width="16" height="16" rx="3" fill="#4B5563" />
        <text x="35" y="14" fill="#94A3B8">Messages</text>
      </g>

      <!-- Item: Bookmarks -->
      <g transform="translate(0, 224)">
        <rect x="5" y="0" width="16" height="16" rx="3" fill="#4B5563" />
        <text x="35" y="14" fill="#94A3B8">Bookmarks</text>
      </g>
    </g>
    
    <!-- TP Logo at bottom left -->
    <g transform="translate(40, 800)">
      <rect x="0" y="0" width="45" height="45" rx="10" fill="#10B981" />
      <text x="22" y="29" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">tp</text>
    </g>
  </g>

  <!-- Top Navigation bar -->
  <g id="topbar" transform="translate(240, 0)">
    <rect x="0" y="0" width="1160" height="90" fill="#070A13" />
    <line x1="0" y1="90" x2="1160" y2="90" stroke="#1E293B" stroke-width="2" />
    
    <!-- Search Bar -->
    <rect x="40" y="22" width="450" height="46" rx="23" fill="#0B0F19" stroke="#1E293B" stroke-width="2" />
    <text x="75" y="50" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Search posts, people, groups...</text>
    <circle cx="58" cy="44" r="6" stroke="#6B7280" stroke-width="2" fill="none" />
    <line x1="62" y1="48" x2="68" y2="54" stroke="#6B7280" stroke-width="2" stroke-linecap="round" />

    <!-- Avatar stack on top right -->
    <g transform="translate(1000, 25)">
      <circle cx="0" cy="20" r="20" fill="#3B82F6" />
      <circle cx="30" cy="20" r="20" fill="#EC4899" />
      <circle cx="60" cy="20" r="20" fill="#EAB308" />
    </g>
  </g>

  <!-- Center Feed -->
  <g id="feed" transform="translate(280, 120)">
    <!-- Post Input Box -->
    <rect x="0" y="0" width="720" height="130" rx="16" fill="#070A13" stroke="#1E293B" stroke-width="2" />
    <!-- Avatar -->
    <circle cx="45" cy="55" r="22" fill="#10B981" />
    <text x="45" y="61" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ME</text>
    <!-- Placeholder text area -->
    <rect x="85" y="32" width="605" height="46" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />
    <text x="105" y="60" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">What's on your mind?</text>
    <!-- Post Button -->
    <rect x="590" y="88" width="100" height="30" rx="6" fill="#3B82F6" />
    <text x="640" y="108" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Post</text>

    <!-- Post Card -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="720" height="580" rx="16" fill="#070A13" stroke="#1E293B" stroke-width="2" />
      
      <!-- User Info -->
      <circle cx="45" cy="45" r="22" fill="#EC4899" />
      <text x="45" y="51" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PS</text>
      <text x="85" y="42" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Priya Sharma</text>
      <text x="85" y="60" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">2 hours ago</text>

      <!-- Post description -->
      <text x="25" y="105" fill="#F3F4F6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Check out our new college fest! 🥳</text>

      <!-- Post Image Placeholders (Simulating fest photo) -->
      <rect x="25" y="135" width="670" height="350" rx="12" fill="#1E293B" />
      <!-- Stylized silhouettes for crowd graphic inside photo -->
      <path d="M70 485 C70 420 150 420 150 485 M130 485 C130 400 230 400 230 485 M210 485 C210 410 300 410 300 485 M280 485 C280 430 360 430 360 485 M340 485 C340 380 460 380 460 485 M430 485 C430 400 530 400 530 485 M500 485 C500 420 590 420 590 485 M570 485 C570 410 650 410 650 485" fill="#0B0F19" />
      <circle cx="110" cy="410" r="18" fill="#0B0F19" />
      <circle cx="180" cy="380" r="22" fill="#0B0F19" />
      <circle cx="255" cy="390" r="20" fill="#0B0F19" />
      <circle cx="320" cy="410" r="16" fill="#0B0F19" />
      <circle cx="400" cy="360" r="26" fill="#0B0F19" />
      <circle cx="480" cy="380" r="22" fill="#0B0F19" />
      <circle cx="545" cy="410" r="18" fill="#0B0F19" />
      <circle cx="610" cy="390" r="20" fill="#0B0F19" />

      <!-- Like / Comment buttons bar -->
      <line x1="25" y1="510" x2="695" y2="510" stroke="#1E293B" stroke-width="1.5" />
      <text x="45" y="545" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❤️ 142 Likes</text>
      <text x="180" y="545" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">💬 28 Comments</text>
    </g>
  </g>

  <!-- Right Panel: Events -->
  <g id="events-panel" transform="translate(1030, 120)">
    <rect x="0" y="0" width="340" height="740" rx="16" fill="#070A13" stroke="#1E293B" stroke-width="2" />
    <text x="24" y="45" fill="#F3F4F6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Upcoming Events</text>
    
    <!-- Event 1 -->
    <g transform="translate(24, 85)">
      <rect x="0" y="0" width="292" height="110" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />
      <text x="16" y="32" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Hackathon 2025</text>
      <text x="16" y="56" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">May 24, 2025</text>
      <text x="16" y="82" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Register before May 20</text>
    </g>

    <!-- Event 2 -->
    <g transform="translate(24, 215)">
      <rect x="0" y="0" width="292" height="110" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />
      <text x="16" y="32" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Tech Talk</text>
      <text x="16" y="56" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">May 28, 2025</text>
      <text x="16" y="82" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Speaker: Dr. K. Rao</text>
    </g>

    <!-- Event 3 -->
    <g transform="translate(24, 345)">
      <rect x="0" y="0" width="292" height="110" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />
      <text x="16" y="32" fill="#FFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Web Dev Workshop</text>
      <text x="16" y="56" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Jun 02, 2025</text>
      <text x="16" y="82" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Hands-on Next.js demo</text>
    </g>

    <!-- View All Link -->
    <text x="170" y="520" fill="#3B82F6" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">View all events →</text>
  </g>
</svg>
